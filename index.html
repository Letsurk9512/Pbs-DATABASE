<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pbs-ids reportados - LaZoeXD</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color:#f4f4f9;
  color:#333;
}

body.dark-mode {
  background:#121212;
  color:#f4f4f4;
}

.container {
  max-width:600px;
  margin:50px auto;
  padding:20px;
  background:white;
  border-radius:8px;
}

.container.dark-mode {
  background:#1e1e1e;
}

h1 {
 text-align:center;
}

input {
 width:100%;
 padding:10px;
 font-size:16px;
}

button {
 padding:10px 20px;
 margin:5px;
 cursor:pointer;
 border:none;
 border-radius:5px;
 background:#007BFF;
 color:white;
}

button:hover {
 background:#0056b3;
}

.results li {
 list-style:none;
 padding:10px;
 border-bottom:1px solid #ddd;
 display:flex;
 justify-content:space-between;
}

.edit {
 background:#ffc107;
 color:black;
}

.delete {
 background:#dc3545;
}

.message {
 text-align:center;
 margin-top:10px;
}

.dark-mode li {
 border-color:#555;
}

</style>

</head>


<body>

<div class="container">

<h1>Pbs-ids reportados - LaZoeXD</h1>


<p>
Para registrar una PB-ID escribe:
<br>
pb-id - N° de reporte
<br>
Ejemplo:
<br>
pb-IF4PVUkuCQ== - 1/10 Reportes
</p>


<h2>Buscar PBS-IDS</h2>

<input id="searchInput" placeholder="Buscar...">

<button onclick="buscar()">
Buscar
</button>


<div id="results"></div>



<h2>Registrar nueva PBS-IDS</h2>

<input id="addInput" placeholder="Nueva PBS-ID">


<button onclick="registrar()">
Registrar
</button>


<div id="message" class="message"></div>


<br>

<button onclick="toggleMode()">
Modo Oscuro/Luminoso
</button>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL = "https://jybzqgxnrdcmlvbwyvqo.supabase.co/rest/v1/";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5YnpxZ3hucmRjbWx2Ynd5dnFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MDk5ODgsImV4cCI6MjEwMTI4NTk4OH0.J0VpY8hDUpbtydrDiMRD9tecJHNsH84upU0Pk8LaCyw";


const supabase = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);



let data = [];
let ids = [];



async function cargarDatos(){

 const {data:rows,error}=await supabase
 .from("reports")
 .select("*")
 .order("id",{ascending:true});


 if(error){
   console.log(error);
   return;
 }


 data = rows.map(x=>x.content);
 ids = rows.map(x=>x.id);


 buscar();

}


// Buscar PBS-IDS
function buscar(){

 const input = document
 .getElementById("searchInput")
 .value
 .toLowerCase();


 const results = document.getElementById("results");


 const filtered = data
 .map((item,index)=>({item,index}))
 .filter(x =>
   x.item.toLowerCase().includes(input)
 );


 if(filtered.length===0){

  results.innerHTML =
  "<p>No se encontraron resultados.</p>";

  return;
 }



 results.innerHTML =
 "<ul>" +

 filtered.map(x=>`

 <li>

 ${x.item}

 <div>

 <button class="edit"
 onclick="editar(${x.index})">
 Editar
 </button>


 <button class="delete"
 onclick="eliminar(${x.index})">
 Eliminar
 </button>

 </div>


 </li>


 `).join("")

 +"</ul>";

}



// Registrar nueva PBS-ID
async function registrar(){

 const input =
 document.getElementById("addInput")
 .value
 .trim();


 const message =
 document.getElementById("message");



 if(input===""){

  message.innerHTML =
  "Escribe algo antes de registrar.";

  message.style.color="red";

  return;

 }



 if(data.includes(input)){

  message.innerHTML =
  "Esta PBS-ID ya existe.";

  message.style.color="orange";

  return;

 }



 const {error}=await supabase
 .from("reports")
 .insert({

   content:input

 });



 if(error){

  console.log(error);

  message.innerHTML =
  "Error al guardar.";

  message.style.color="red";

  return;

 }



 message.innerHTML =
 "PBS-ID registrada correctamente.";

 message.style.color="green";


 document.getElementById("addInput").value="";


 await cargarDatos();

}




// Editar PBS-ID
async function editar(index){


 const nuevo =
 prompt(
 "Editar PBS-ID:",
 data[index]
 );


 if(!nuevo || nuevo.trim()==="")
 return;



 const {error}=await supabase
 .from("reports")
 .update({

  content:nuevo.trim()

 })
 .eq(
 "id",
 ids[index]
 );


 if(error){

 console.log(error);

 return;

 }



 await cargarDatos();


}




// Eliminar PBS-ID
async function eliminar(index){


 if(!confirm(
 "¿Eliminar esta PBS-ID?"
 ))
 return;



 const {error}=await supabase
 .from("reports")
 .delete()
 .eq(
 "id",
 ids[index]
 );



 if(error){

 console.log(error);

 return;

 }



 await cargarDatos();


}





// Modo oscuro

function toggleMode(){

 document.body
 .classList
 .toggle("dark-mode");


 document.querySelector(".container")
 .classList
 .toggle("dark-mode");


}



 // iniciar

cargarDatos();


</script>


</body>
</html>
