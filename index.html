<body>

<h2>PBs reportadas</h2>

<input id="pb" placeholder="pb-id - reportes">
<button onclick="guardar()">Registrar</button>

<ul id="lista"></ul>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://jybzqgxnrdcmlvbwyvqo.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5YnpxZ3hucmRjbWx2Ynd5dnFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MDk5ODgsImV4cCI6MjEwMTI4NTk4OH0.J0VpY8hDUpbtydrDiMRD9tecJHNsH84upU0Pk8LaCyw";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function cargar(){

    const {data,error}=await supabase
    .from("reports")
    .select("*")
    .order("id");

    if(error){
        console.log(error);
        return;
    }

    lista.innerHTML="";

    data.forEach(x=>{

        lista.innerHTML += `
        <li>${x.content}</li>
        `;

    });

}



async function guardar(){

    let texto=document.getElementById("pb").value;

    if(!texto) return;


    const {error}=await supabase
    .from("reports")
    .insert({
        content:texto
    });


    if(error){

        console.log(error);
        alert("Error: "+error.message);
        return;

    }


    document.getElementById("pb").value="";

    cargar();

}


cargar();

</script>

</body>
</html>
